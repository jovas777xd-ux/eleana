name: Conectar catalogo ELEANA preservando el HTML original

on:
  push:
    branches:
      - eleana-integrar-catalogo-supabase-225-20261126
    paths:
      - '.github/workflows/conectar-eleana.yml'
      - 'tools/conectar_catalogo_eleana.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama de integracion
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Insertar conexion en el HTML sin cambiar imagenes
        run: python3 tools/conectar_catalogo_eleana.py

      - name: Guardar HTML actualizado en la rama de integracion
        run: |
          if git diff --quiet -- index.html; then
            echo "No hay modificaciones."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Conectar ELEANA a Supabase sin modificar los productos originales"
          git push
